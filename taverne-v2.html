<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taverne — grimoire noir et or</title>
<style>
/* Grimoire noir et or : fond d'encre chaude, filets dorés, petites capitales, portraits en grand.
   Inspiré de la carte « Mace de la Flamme Sacrée » partagée par le groupe. */
:root{
  --bg:#0d0b09; --surface:#16120e; --surface2:#1e1813; --line:#3a2f22; --line2:#5a4930;
  --ink:#ebe2d0; --muted:#a39580; --faint:#76695a;
  --gold:#d8b26a; --gold-hi:#f4d68f; --gold-lo:#8a6d3b;
  --blood:#c0392b; --arcane:#a58bdc; --life:#6fae6a; --warn:#d99a3a;
  --serif:"Cormorant Garamond","EB Garamond",Garamond,"Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--serif)}
body{background:radial-gradient(120% 60% at 50% 0%,#1d1610 0%,var(--bg) 60%) fixed,var(--bg)}
h1,h2,h3{margin:0;font-family:var(--serif);font-variant:small-caps;letter-spacing:.06em;font-weight:600;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:var(--surface2);border:1px solid var(--line2);border-radius:3px;min-height:42px;padding:0 14px}
button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
button.or{white-space:nowrap;background:linear-gradient(180deg,#e7c27a,#b98f45);color:#1a1207;border-color:#f4d68f;font-variant:small-caps;letter-spacing:.06em;font-weight:700}
input{font:inherit;color:var(--ink);background:#0f0c09;border:1px solid var(--line2);border-radius:3px;padding:11px;width:100%}
.app{max-width:600px;margin:auto;min-height:100vh;padding-bottom:96px;position:relative}
/* bandeau maquette */
.demo{position:sticky;top:0;z-index:20;background:#0a0807ee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:12px var(--sans)}
.demo b{color:var(--gold);letter-spacing:.14em;font-size:11px}
.demo .seg{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;margin-left:auto}
.demo .seg button{border:0;border-radius:0;min-height:30px;background:transparent;font:600 12px var(--sans)}
.demo .seg button.on{background:var(--gold);color:#1a1207}
.demo .mini{min-height:30px;font:12px var(--sans);background:transparent}
.page{padding:14px 16px}
.kicker{font:600 10px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.small{font:12px var(--sans);color:var(--muted)}
/* séparateur à losange, comme sur la carte d'objet */
.rule{display:flex;align-items:center;gap:10px;color:var(--gold-lo);margin:14px 0}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-lo),transparent)}
.rule i{font-style:normal;font-size:10px;color:var(--gold)}
/* cadre doré à coins */
.frame{position:relative;background:linear-gradient(180deg,#19140f,#130f0b);border:1px solid var(--line2);border-radius:2px;padding:14px;margin-bottom:12px;box-shadow:inset 0 0 0 3px #0d0b09,inset 0 0 0 4px #3a2f2299}
.frame::before,.frame::after{content:"";position:absolute;width:12px;height:12px;border:1px solid var(--gold)}
.frame::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.frame::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.note{font:13px/1.5 var(--sans);color:#d9cfe9;border-left:2px solid var(--arcane);background:#a58bdc12;padding:9px 11px;margin:12px 0;border-radius:0 3px 3px 0}
.note b{color:var(--arcane)}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 11px var(--sans);padding:2px 8px;border-radius:2px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.chip.mal{border-color:#c0392b99;color:#f0a49a}
.chip.bien{border-color:var(--gold-lo);color:var(--gold-hi)}
.chip.arc{border-color:#a58bdc99;color:#cdbaf5}
.bar{height:5px;background:#2a2219;overflow:hidden}
.bar i{display:block;height:100%}
.ok{background:linear-gradient(90deg,#4f8a4c,var(--life))}.hurt{background:linear-gradient(90deg,#a8702a,var(--warn))}.crit{background:linear-gradient(90deg,#8e2219,var(--blood))}
/* navigation du bas */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:600px;display:grid;background:#0a0807f2;border-top:1px solid var(--line2);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:15}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 10px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);min-height:52px}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5}
.nav button.on{color:var(--gold-hi)}
.nav button.on svg{filter:drop-shadow(0 0 6px #d8b26a88)}
/* accueil */
.crest{text-align:center;padding:30px 20px 6px}
.crest svg{width:46px;height:46px;stroke:var(--gold);fill:none;stroke-width:1.2}
.crest h1{font-size:40px;color:var(--gold-hi);line-height:1.05;margin-top:6px}
.crest p{font-style:italic;color:var(--muted);margin-top:6px}
.camp{position:relative;overflow:hidden;border:1px solid var(--line2);margin-bottom:14px;cursor:pointer;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end}
.camp>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.camp::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 10%,#0d0b09f0 78%)}
.camp .in{position:relative;z-index:1;padding:14px}
.camp h2{font-size:24px;color:var(--gold-hi)}
.avatars{display:flex;margin-top:8px}
.avatars img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:center 18%;border:2px solid var(--bg);margin-right:-8px;box-shadow:0 0 0 1px var(--gold-lo)}
.role{font:700 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:3px 8px;border-radius:2px}
.role.mj{background:var(--arcane);color:#140d22}.role.pj{background:var(--gold);color:#1a1207}
/* fiche : portrait en grand */
.hero{position:relative;height:340px;overflow:hidden}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%;transition:filter .4s}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0d0b0966 0,transparent 30%,#0d0b09cc 78%,var(--bg))}
.hero .t{position:absolute;left:16px;right:16px;bottom:14px;z-index:1}
.hero h1{font-size:34px;color:var(--gold-hi);text-shadow:0 2px 10px #000}
.hero .sub{font-style:italic;color:#d9cdb6;text-shadow:0 1px 6px #000}
.who{display:flex;gap:6px;position:absolute;top:12px;left:12px;z-index:2}
.who button{min-height:32px;padding:0 10px;font:600 12px var(--sans);background:#0d0b09b3;backdrop-filter:blur(4px);border-color:var(--line2);border-radius:999px}
.who button.on{border-color:var(--gold);color:var(--gold-hi)}
/* état vivant */
.app.rage .hero>img{filter:saturate(1.3) contrast(1.1) sepia(.2) hue-rotate(-12deg)}
.app.rage .hero::before{content:"";position:absolute;inset:0;z-index:1;box-shadow:inset 0 0 90px #c0392bcc;pointer-events:none}
.app.rage{box-shadow:0 0 0 2px var(--blood)}
.app.voeu .hero::before{content:"";position:absolute;inset:0;z-index:1;box-shadow:inset 0 0 90px #a58bdcaa;pointer-events:none}
.app.voeu{box-shadow:0 0 0 2px var(--arcane)}
.hp{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:10px}
.hp button{height:52px;font-size:26px;padding:0}
.hp .mid{text-align:center}
.hp strong{font-size:46px;line-height:1;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.stats div{text-align:center;border:1px solid var(--line);padding:8px 2px;background:#120e0b}
.stats b{display:block;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.stats small{font:10px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.abil{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.abil div{text-align:center;border:1px solid var(--line);padding:6px 0;background:#120e0b}
.abil small{font:600 9px var(--sans);letter-spacing:.1em;color:var(--gold)}
.abil b{display:block;font-size:18px}
.abil i{font:11px var(--sans);font-style:normal;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.tabs button{min-height:34px;font-variant:small-caps;letter-spacing:.06em;white-space:nowrap;background:transparent;border-color:var(--line)}
.tabs button.on{border-color:var(--gold);color:var(--gold-hi);background:#d8b26a14}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line span{color:var(--gold-hi);font:600 13px var(--sans);white-space:nowrap;font-variant-numeric:tabular-nums}
.effets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.effets button{min-height:38px;font-variant:small-caps;letter-spacing:.05em}
.effets button.rage{border-color:var(--blood);color:#f0a49a}
.effets button.rage.on{background:var(--blood);color:#fff}
.effets button.voeu{border-color:var(--arcane);color:#cdbaf5}
.effets button.voeu.on{background:var(--arcane);color:#140d22}
.pips{display:flex;gap:8px}
.pip{width:18px;height:18px;min-height:0;padding:0;transform:rotate(45deg);border:1px solid var(--gold);background:transparent;border-radius:0}
.pip.full{background:var(--gold)}
/* carte d'objet magique */
.objet{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.objet img{width:96px;height:140px;object-fit:cover;object-position:62% 30%;border:1px solid var(--line2)}
.objet h3{font-size:20px;color:var(--gold-hi);line-height:1.1}
.objet .rare{font-style:italic;color:var(--muted);font-size:14px;margin:2px 0 6px}
.prop{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:14px}
.prop dt{font-variant:small-caps;color:var(--gold);letter-spacing:.04em}
.prop dd{margin:0}
.flavor{font-style:italic;color:#cbbfa7;text-align:center;margin:10px 4px;font-size:15px}
/* combat */
.round{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-bottom:10px}
.round h2{font-size:26px;color:var(--gold-hi);line-height:1}
.init{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.ent{display:grid;grid-template-columns:30px 48px 1fr auto;gap:10px;align-items:center;padding:8px 10px;background:#140f0c;border:1px solid var(--line);cursor:pointer;position:relative}
.ent .n{font:700 18px var(--serif);color:var(--gold);text-align:center;font-variant-numeric:tabular-nums}
.ent .av{width:48px;height:48px;border-radius:50%;object-fit:cover;object-position:center 18%;border:2px solid var(--gold-lo)}
.ent .sig{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:2px solid #6b2a22;background:radial-gradient(circle,#2a1410,#120a08);color:#e08b80;font:700 17px var(--serif);font-variant:small-caps}
.ent h3{font-size:17px;line-height:1.1}
.ent .meta{font:11px var(--sans);color:var(--muted);margin:2px 0 5px}
.ent .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.ent .pv{text-align:right;font:12px var(--sans);color:var(--muted)}
.ent .pv b{display:block;font:700 22px var(--serif);color:var(--ink);font-variant-numeric:tabular-nums}
.ent.cur{border-color:var(--gold);background:linear-gradient(90deg,#2a2112,#140f0c 70%);box-shadow:0 0 18px #d8b26a33}
.ent.cur::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--gold-hi)}
.ent.cur .av{border-color:var(--gold-hi)}
.ent.down{opacity:.4;filter:grayscale(1)}
.ent.mon h3{color:#f0c6bf}
/* groupe : cartes portrait */
.party{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{position:relative;aspect-ratio:3/4.4;max-width:100%;overflow:hidden;border:1px solid var(--line2);cursor:pointer}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 18%}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#0d0b09f2 88%);box-shadow:inset 0 0 0 4px #0d0b0988,inset 0 0 0 5px #d8b26a55}
.card .in{position:absolute;left:10px;right:10px;bottom:10px;z-index:1}
.card h3{font-size:17px;color:var(--gold-hi);line-height:1.1}
.card p{font:11px var(--sans);color:#cfc3ad}
.card .bar{margin-top:6px}
/* bloc de stats façon grimoire */
.stat h2{font-size:26px;color:#f0b9b0}
.stat .type{font-style:italic;color:var(--muted)}
.stat p{margin:3px 0;font-size:15px}
.stat p b{font-variant:small-caps;color:var(--gold);letter-spacing:.03em}
.stat .act b{color:var(--gold-hi);font-style:italic;font-variant:normal}
/* journal */
.entry img{width:100%;height:180px;object-fit:cover;object-position:center 60%;border:1px solid var(--line2);margin-bottom:10px}
.entry h3{font-size:20px;color:var(--gold-hi)}
.entry .by{font:12px var(--sans);color:var(--muted);margin:2px 0 8px}
.entry p{color:#d6ccb8}
.secret{border-style:dashed;border-color:#a58bdc88}
/* feuille du bas */
.veil{position:fixed;inset:0;background:#000b;z-index:30;display:none}
.veil.open{display:block}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,600px);max-height:88vh;overflow:auto;background:#15110d;border-top:1px solid var(--gold-lo);padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));z-index:31;display:none}
.sheet.open{display:block}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.sheet header h2{font-size:24px;color:var(--gold-hi)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.keypad button{min-height:48px;font-size:22px}
.out{text-align:center;font:600 52px var(--serif);color:var(--gold-hi);font-variant-numeric:tabular-nums}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.conds{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.conds button{min-height:32px;font:12px var(--sans);border-radius:999px}
.conds button.on{background:#c0392b33;border-color:var(--blood);color:#f0a49a}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="veil" id="veil" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>

    plus:['<b>Compétences</b> Discrétion +4 (+6 dans la pénombre ou les ténèbres)','<b>Vulnérabilités</b> radiant','<b>Résistances</b> acide, froid, feu, foudre, tonnerre ; contondant, perforant et tranchant non magiques','<b>Immunités</b> nécrotique, poison ; épuisement, effrayé, agrippé, paralysé, pétrifié, empoisonné, à terre, entravé'],
    traits:[['Amorphe','Peut passer par un espace large de 2,5 cm sans se faufiler.'],['Discrétion dans l\'ombre','Dans la pénombre ou les ténèbres, peut se cacher par une action bonus.'],['Faiblesse à la lumière du soleil','Désavantage aux attaques, tests et sauvegardes en plein soleil.']],
    actions:[['Absorption de force','+4 au toucher, allonge 1,50 m. Touché : 9 (2d6 + 2) nécrotiques, et la Force de la cible baisse de 1d4. Elle meurt si sa Force tombe à 0. Repos court ou long : la baisse disparaît.']] },
  squelette:{ nom:'Squelette', type:'Mort-vivant de taille M, loyal mauvais', ca:13, caT:'13 (restes d\'armure)', pv:13, pvF:'2d8 + 4', vit:'9 m', fp:'1/4 (50 PX)', ab:[10,14,15,6,8,5],
    plus:['<b>Vulnérabilités</b> contondant','<b>Immunités</b> poison ; épuisement, empoisonné','<b>Sens</b> vision dans le noir 18 m, Perception passive 9'],
    traits:[], actions:[['Épée courte','+4 au toucher, allonge 1,50 m. Touché : 5 (1d6 + 2) perforants.'],['Arc court','+4 au toucher, portée 24/96 m. Touché : 5 (1d6 + 2) perforants.']] },
  loup:{ nom:'Loup', type:'Bête de taille M, sans alignement', ca:13, caT:'13 (armure naturelle)', pv:11, pvF:'2d8 + 2', vit:'12 m', fp:'1/4 (50 PX)', ab:[12,15,12,3,12,6],
    plus:['<b>Compétences</b> Discrétion +4, Perception +3'],
    traits:[['Tactique de groupe','Avantage à l\'attaque si un allié non neutralisé est à 1,50 m de la cible.']],
    actions:[['Morsure','+4 au toucher, allonge 1,50 m. Touché : 7 (2d4 + 2) perforants. Sauvegarde de Force DD 11 ou la cible tombe à terre.']] },
};

const S = { ecran:'accueil', role:'pj', ong:{pj:'fiche',mj:'combat'}, perso:'korgan', sous:'tour', effets:{korgan:false,kaelthar:false}, round:3, tour:2, choix:{} };

let COMBAT = [
  { id:'galinndan', pj:1, init:21, pv:33, max:33, et:[] },
  { id:'ombre', mon:'ombre', nom:'Ombre', init:16, pv:9, max:16, et:[] },
  { id:'kaelthar', pj:1, init:14, pv:31, max:36, et:['Vœu d\'inimitié'] },
  { id:'goule1', mon:'goule', nom:'Goule', init:12, pv:22, max:22, et:['Effrayé'] },
  { id:'zephira', pj:1, init:11, pv:22, max:36, et:['Concentration'] },
  { id:'zomb1', mon:'zombie', nom:'Zombie A', init:6, pv:14, max:22, et:[] },
  { id:'zomb2', mon:'zombie', nom:'Zombie B', init:6, pv:0, max:22, et:['À terre'] },
];
const ETATS = ['À terre','Agrippé','Assourdi','Aveuglé','Charmé','Effrayé','Empoisonné','Entravé','Étourdi','Inconscient','Invisible','Neutralisé','Paralysé','Pétrifié','Concentration'];

/* ===== Outils ===== */
const $ = id => document.getElementById(id);
const mod = s => Math.floor((s-10)/2), sg = n => (n>=0?'+':'')+n;
const cls = (h,m) => h/m>.5?'ok':h/m>.25?'hurt':'crit';
const vague = (h,m) => h<=0?'Hors de combat':h/m>.75?'Indemne':h/m>.5?'Égratigné':h/m>.25?'Blessé':'En sang';
const nomE = e => e.pj ? PJ[e.id].nom.split(' ')[0] : e.nom;
const rule = () => '<div class="rule"><i>◆</i></div>';
function role(r){ S.role=r; if(S.ecran==='accueil') S.ecran='camp'; draw(); }
function go(t){ S.ong[S.role]=t; draw(); scrollTo(0,0); }

/* ===== Rendu ===== */
function draw(){
  const p = PJ[S.perso];
  const vivant = S.ecran==='camp' && S.role==='pj' && S.ong.pj==='fiche' && S.effets[S.perso];
  $('app').className = 'app' + (vivant ? ' '+p.effet : '');
  $('app').innerHTML = `<div class="demo"><b>MAQUETTE V2</b><button class="mini" onclick="S.ecran='accueil';draw()">Accueil</button>
    <div class="seg"><button class="${S.role==='pj'?'on':''}" onclick="role('pj')">Joueur</button><button class="${S.role==='mj'?'on':''}" onclick="role('mj')">MJ</button></div></div>`
    + (S.ecran==='accueil' ? accueil() : S.role==='pj' ? vueJoueur() : vueMJ());
}

function accueil(){
  const av = ids => `<div class="avatars">${ids.map(i=>`<img src="${PJ[i].img}" alt="${PJ[i].nom}">`).join('')}</div>`;
  return `<div class="crest">${ICO.blason}<h1>La Taverne</h1><p>Le carnet de campagne du groupe</p></div>
  <div class="page">
    <div class="frame" style="display:grid;gap:8px"><p class="kicker">Connexion</p><input value="alex.demo" aria-label="Pseudo"><input type="password" value="motdepasse" aria-label="Mot de passe"><button class="or" onclick="role('pj')">Entrer dans la Taverne</button></div>
    ${rule()}
    <p class="kicker" style="margin-bottom:10px">Mes campagnes</p>
    <div class="camp" onclick="S.perso='kaelthar';role('pj')"><img src="${IMG.kaelthar}" alt="" style="object-position:center 12%"><div class="in"><span class="role pj">Joueur</span><h2 style="margin-top:6px">L'Auberge de l'Ours Rouge</h2><p class="small">Horreur · 3 aventuriers · prochaine séance vendredi</p>${av(['kaelthar','zephira','galinndan'])}</div></div>
    <div class="camp" onclick="S.perso='korgan';role('pj')"><img src="${IMG.bateau}" alt="" style="object-position:center 55%"><div class="in"><span class="role pj">Joueur</span><h2 style="margin-top:6px">L'Ombre de la Reine Dragon</h2><p class="small">Dragonlance · MJ : Dominique · 3 aventuriers</p>${av(['korgan','ludo'])}</div></div>
    <div class="camp" style="min-height:120px" onclick="role('mj')"><div class="in"><span class="role mj">MJ</span><h2 style="margin-top:6px">Ma campagne de test</h2><p class="small">Ici, c'est toi qui mènes le jeu.</p></div></div>
    <button style="width:100%">+ Créer une campagne</button>
    <div class="note"><b>Idée :</b> le MJ crée la campagne et envoie un lien d'invitation. On peut être joueur ici et MJ ailleurs.</div>
  </div>`;
}

/* ----- Joueur ----- */
function vueJoueur(){
  const t=S.ong.pj;
  return (t==='fiche'?fiche():t==='combat'?combatJoueur():t==='groupe'?groupe(false):journal(false))
    + nav([['fiche','Fiche'],['combat','Combat'],['groupe','Groupe'],['journal','Journal']],t);
}

function fiche(){
  const p=PJ[S.perso], on=S.effets[S.perso];
  const tabs=[['tour','Mon tour'],['carac','Caractéristiques'],['ress','Ressources'],['sac','Sac'],['hist','Histoire']];
  let c='';
  if(S.sous==='tour') c=`
    <div class="frame"><div class="hp"><button onclick="ouvrirPV('${S.perso}')" aria-label="Retirer des PV">−</button><div class="mid"><strong>${p.pv}</strong> <span class="muted">/ ${p.max} PV</span><div class="bar" style="margin:8px 0 4px"><i class="${cls(p.pv,p.max)}" style="width:${p.pv/p.max*100}%"></i></div><span class="small">PV temporaires : 0</span></div><button onclick="ouvrirPV('${S.perso}')" aria-label="Ajouter des PV">+</button></div></div>
    <div class="stats"><div><b>${p.ca}</b><small>CA</small></div><div><b>${p.init}</b><small>Initiative</small></div><div><b>${p.vit}</b><small>Vitesse</small></div><div><b>${p.pp}</b><small>Perc. passive</small></div></div>
    <div class="effets"><button class="${p.effet} ${on?'on':''}" onclick="basculer()">${on?'✦ '+p.effetNom+' en cours':'+ '+p.effetNom}</button><button>+ Bonus / malus</button></div>
    <div class="frame"><div class="round" style="margin:0"><h3 style="font-size:20px;color:var(--gold-hi)">Mon tour</h3><span class="small">Round ${S.round}</span></div>
      <p class="kicker" style="margin-top:10px">Action</p>
      ${p.actions.map(([n,a,d])=>`<div class="line">${n}<span>${a} · ${d}${on&&p.effet==='rage'&&d!=='—'?' +2':''}</span></div>`).join('')}
      <p class="kicker" style="margin-top:10px">Action bonus</p><p>${p.bonus}</p>
      ${on?`<p style="margin-top:8px;color:${p.effet==='rage'?'#f0a49a':'#cdbaf5'}">${p.effetTxt}</p>`:''}
    </div>
    <div class="note"><b>Carte vivante :</b> touche « ${p.effetNom} » : le portrait et le cadre changent de couleur. Les dés restent réels, l'app montre quoi lancer.</div>`;
  if(S.sous==='carac') c=`
    <div class="abil">${['FOR','DEX','CON','INT','SAG','CHA'].map((n,i)=>`<div><small>${n}</small><b>${sg(mod(p.ab[i]))}</b><i>${p.ab[i]}</i></div>`).join('')}</div>
    <div class="frame" style="margin-top:12px"><p class="kicker">Sauvegardes maîtrisées</p>${S.perso==='korgan'?'<div class="line">Force<span>+6</span></div><div class="line">Constitution<span>+5</span></div>':'<div class="line">Sagesse<span>+3</span></div><div class="line">Charisme<span>+5</span></div>'}</div>`;
  if(S.sous==='ress') c=`<div class="frame">${p.res.map(([n,v,m,r])=>`<div class="line"><div>${n}<div class="small">Repos ${r}</div></div>${m<=4?`<div class="pips">${Array.from({length:m},(_,i)=>`<button class="pip ${i<v?'full':''}" aria-label="${n} ${i+1}"></button>`).join('')}</div>`:`<span>${v} / ${m}</span>`}</div>`).join('')}</div>
    <div class="g3" style="grid-template-columns:1fr 1fr"><button>Repos court</button><button>Repos long</button></div>`;
  if(S.sous==='sac') c=`
    <div class="frame"><div class="objet"><img src="${IMG.mace}" alt="Mace de la Flamme Sacrée"><div><h3>Mace de la Flamme Sacrée</h3><p class="rare">Arme (masse), très rare · harmonisation : clerc ou paladin</p>
      <dl class="prop"><dt>Dégâts</dt><dd>1d6 contondants</dd><dt>Propriété</dt><dd>Polyvalente (1d8)</dd><dt>Poids</dt><dd>2 kg</dd></dl></div></div>
      <p class="flavor">« Forgée dans la prière et trempée dans la lumière éternelle… »</p>
      ${rule()}<p><b style="color:var(--gold);font-variant:small-caps">Allongement sacré.</b> Une chaîne de lumière relie le manche à la tête : l'attaque gagne 4,50 m de portée.</p>
      <p class="small" style="margin-top:8px">Objet d'exemple tiré des cartes du groupe.</p></div>
    <div class="frame"><div class="line">Rations ×5<span>2,5 kg</span></div><div class="line">Corde de chanvre (15 m)<span>5 kg</span></div><div class="line">Bourse<span>12 po · 30 pa</span></div></div>`;
  if(S.sous==='hist') c=`<div class="frame"><p>${S.perso==='korgan'?'Fils de Kaerth le forgeron. Frère d\'Asterak, qui rêve d\'être chevalier de Solamnie. Lié à Ludo par l\'amitié des familles de-Orilg et Tire-Gousset.':'Chasseur silencieux au service de la Raven Queen. Loyal, peu bavard. Il traque ce qui revient de la mort.'}</p></div>`;
  return `<div class="hero"><img src="${p.img}" alt="${p.nom}" style="object-position:${p.pos}">
      <div class="who">${['korgan','kaelthar'].map(i=>`<button class="${S.perso===i?'on':''}" onclick="S.perso='${i}';S.sous='tour';draw()">${PJ[i].nom.split(' ')[0]}</button>`).join('')}</div>
      <div class="t"><p class="kicker">Joueur · ${p.joueur}</p><h1>${p.nom}</h1><p class="sub">${p.desc}</p></div></div>
    <div class="tabs">${tabs.map(([i,l])=>`<button class="${S.sous===i?'on':''}" onclick="S.sous='${i}';draw()">${l}</button>`).join('')}</div>
    <div class="page" style="padding-top:2px">${c}</div>`;
}

function combatJoueur(){
  return `<div class="page"><div class="round"><div><p class="kicker">L'Auberge de l'Ours Rouge</p><h2>Round ${S.round}</h2></div><span class="chip bien">Tour de ${nomE(COMBAT[S.tour])}</span></div>
    <ol class="init">${COMBAT.map((e,i)=>ligne(e,i,false)).join('')}</ol>
    <div class="note"><b>Côté joueur :</b> l'ordre des tours et tes alliés en clair. Pour les monstres, juste un état (« Blessé », « En sang »), jamais leurs PV.</div></div>`;
}

/* ----- MJ ----- */
function vueMJ(){
  const t=S.ong.mj;
  return (t==='combat'?combatMJ():t==='bestiaire'?bestiaire():t==='groupe'?groupe(true):journal(true))
    + nav([['combat','Combat'],['bestiaire','Bestiaire'],['groupe','Groupe'],['journal','Journal']],t);
}

function ligne(e,i,mj){
  const m=e.mon?MON[e.mon]:null, p=e.pj?PJ[e.id]:null;
  const visu = p ? `<img class="av" src="${p.img}" alt="" style="object-position:${p.pos}">` : `<div class="sig">${e.nom.slice(0,2)}</div>`;
  const montre = mj || e.pj;
  return `<li class="ent ${e.mon?'mon':''} ${i===S.tour?'cur':''} ${e.pv<=0?'down':''}" ${mj?`onclick="ouvrirE(${i})"`:''}>
    <div class="n">${mj?e.init:i+1}</div>${visu}
    <div><h3>${nomE(e)}</h3><div class="meta">${p?(mj?`CA ${p.ca} · Perc. passive ${p.pp} · ${p.joueur}`:p.desc.split(' · ')[1]):(mj?`CA ${m.ca} · FP ${m.fp.split(' ')[0]}`:vague(e.pv,e.max))}</div>
      ${montre?`<div class="bar"><i class="${cls(e.pv,e.max)}" style="width:${Math.max(0,e.pv/e.max*100)}%"></i></div>`:''}
      ${e.et.length?`<div class="chips">${e.et.map(c=>`<span class="chip ${c==='Concentration'||c.startsWith('Vœu')?'arc':'mal'}">${c}</span>`).join('')}</div>`:''}</div>
    <div class="pv">${montre?`<b>${e.pv}</b>/ ${e.max}`:''}</div></li>`;
}

function combatMJ(){
  return `<div class="page">
    <div class="round"><div><p class="kicker">Écran du MJ · L'Auberge de l'Ours Rouge</p><h2>Round ${S.round}</h2></div>
      <div style="display:flex;gap:6px"><button onclick="tour(-1)" aria-label="Tour précédent">◀</button><button class="or" onclick="tour(1)">Tour suivant</button></div></div>
    <ol class="init">${COMBAT.map((e,i)=>ligne(e,i,true)).join('')}</ol>
    <div class="g3" style="grid-template-columns:1fr 1fr;margin-top:10px"><button onclick="go('bestiaire')">+ Créatures</button><button onclick="finCombat()">Fin du combat</button></div>
    <div class="note"><b>Comment ça marche :</b> l'ordre se trie tout seul. Touche une ligne pour retirer des PV, mettre un état ou lire la fiche du monstre. Les PV des joueurs viennent de leurs fiches, en direct.</div></div>`;
}

function bestiaire(){
  const n=Object.values(S.choix).reduce((a,b)=>a+b,0);
  return `<div class="page"><p class="kicker">Bestiaire</p><h2 style="font-size:26px;color:var(--gold-hi);margin-bottom:10px">Préparer une rencontre</h2>
    <input placeholder="Chercher une créature : goule, ombre…" aria-label="Chercher une créature" style="margin-bottom:12px">
    <div class="frame">${Object.entries(MON).map(([id,m])=>`<div class="line" style="align-items:center"><div style="flex:1;cursor:pointer" onclick="voirMon('${id}')"><b style="font-size:17px;font-variant:small-caps;letter-spacing:.04em">${m.nom}</b><div class="small">FP ${m.fp.split(' ')[0]} · CA ${m.ca} · PV ${m.pv} (${m.pvF})</div></div>
      <div style="display:flex;align-items:center;gap:6px"><button style="width:38px;padding:0" onclick="choisir('${id}',-1)">−</button><b style="width:18px;text-align:center">${S.choix[id]||0}</b><button style="width:38px;padding:0" onclick="choisir('${id}',1)">+</button></div></div>`).join('')}</div>
    <button class="or" style="width:100%" onclick="ajouter()" ${n?'':'disabled'}>Ajouter au combat${n?' ('+n+')':''}</button>
    <div class="note"><b>Les créatures :</b> celles des règles libres de D&D 5e (environ 300). Le MJ pourra aussi créer les siennes.</div>
    <div class="note"><b>Question pour le MJ :</b> l'app tire l'initiative des monstres, ou il lance ses vrais dés ?</div></div>`;
}

function groupe(mj){
  const camp = S.role==='pj' && S.perso==='korgan' ? 'dl' : 'or';
  const ids = Object.keys(PJ).filter(i=>PJ[i].camp===camp);
  return `<div class="page"><p class="kicker">${camp==='or'?'L\'Auberge de l\'Ours Rouge':'L\'Ombre de la Reine Dragon'}</p><h2 style="font-size:26px;color:var(--gold-hi);margin-bottom:12px">Le groupe</h2>
    <div class="party">${ids.map(i=>{const p=PJ[i];return `<div class="card"><img src="${p.img}" alt="${p.nom}" style="object-position:${p.pos}"><div class="in"><h3>${p.nom}</h3><p>${p.desc}</p><p>${p.joueur} · CA ${p.ca}${mj?' · PP '+p.pp:''}</p><div class="bar"><i class="${cls(p.pv,p.max)}" style="width:${p.pv/p.max*100}%"></i></div></div></div>`;}).join('')}</div>
    <div class="note"><b>${mj?'Pour le MJ':'Pour les joueurs'} :</b> ${mj?'PV, CA et Perception passive de chacun d\'un coup d\'œil, pratique pour les jets cachés.':'on voit les autres personnages. Ce qui est marqué secret reste entre le joueur et le MJ.'}</div></div>`;
}

function journal(mj){
  return `<div class="page"><p class="kicker">Journal de campagne</p><h2 style="font-size:26px;color:var(--gold-hi);margin-bottom:12px">Notes de session</h2>
    <div class="frame entry"><img src="${IMG.bateau}" alt="Korgan et Ludo sur le pont du navire"><h3>La traversée</h3><p class="by">Séance du 30 octobre · par Dominique (MJ)</p><p>Le navire quitte le port vers l'est. Ludo guette l'île à l'horizon, Korgan se tient au bastingage. Personne ne parle de la lettre scellée.</p></div>
    ${mj?`<div class="frame entry secret"><h3>🔒 Notes secrètes</h3><p class="by">Visible par le MJ seulement</p><p>L'ogre de l'île porte la suite de la lettre. À révéler seulement si quelqu'un fouille le corps.</p></div>`:''}
    <div class="frame entry"><h3>Ce que Ludo a « emprunté »</h3><p class="by">par Charlie</p><p>Une bague en cuivre, trois boutons dorés et une carte froissée du marais.</p></div>
    <button style="width:100%">+ Nouvelle note${mj?' (publique ou secrète)':''}</button></div>`;
}

function nav(items,cur){
  return `<nav class="nav" style="grid-template-columns:repeat(${items.length},1fr)">${items.map(([id,l])=>`<button class="${cur===id?'on':''}" onclick="go('${id}')">${ICO[id]}${l}</button>`).join('')}</nav>`;
}

/* ===== Actions ===== */
function basculer(){ const id=S.perso; S.effets[id]=!S.effets[id]; const e=COMBAT.find(c=>c.id===id); if(e&&id==='kaelthar'){ e.et = S.effets[id] ? [...new Set([...e.et,'Vœu d\'inimitié'])] : e.et.filter(x=>!x.startsWith('Vœu')); } draw(); }
function tour(d){ S.tour+=d; if(S.tour>=COMBAT.length){S.tour=0;S.round++;} if(S.tour<0){S.tour=COMBAT.length-1;S.round=Math.max(1,S.round-1);} draw(); }
function choisir(id,d){ S.choix[id]=Math.max(0,(S.choix[id]||0)+d); draw(); }
function ajouter(){
  const cur=COMBAT[S.tour];
  for(const [id,n] of Object.entries(S.choix)) for(let i=0;i<n;i++){
    const m=MON[id], k=COMBAT.filter(c=>c.mon===id).length;
    COMBAT.push({ id:id+Date.now()+i, mon:id, nom:m.nom+' '+String.fromCharCode(65+k), init:1+Math.floor(Math.random()*20)+mod(m.ab[1]), pv:m.pv, max:m.pv, et:[] });
  }
  COMBAT.sort((a,b)=>b.init-a.init); S.tour=COMBAT.indexOf(cur); S.choix={}; S.ong.mj='combat'; draw();
}
function finCombat(){ ouvrir(`<header><h2>Fin du combat ?</h2><button onclick="closeSheet()">✕</button></header><p>Les créatures sont retirées. Expérience gagnée : 1 ombre, 1 goule et 2 zombies = 400 PX, soit environ 133 PX par aventurier.</p><div class="g3" style="grid-template-columns:1fr 1fr;margin-top:14px"><button onclick="closeSheet()">Annuler</button><button class="or" onclick="closeSheet()">Terminer</button></div>`); }

/* ===== Feuilles ===== */
let saisie='', cible=null;
function ouvrir(h){ $('sheet').innerHTML=h; $('sheet').classList.add('open'); $('veil').classList.add('open'); }
function closeSheet(){ $('sheet').classList.remove('open'); $('veil').classList.remove('open'); }
function blocStat(m){
  return `<div class="stat"><h2>${m.nom}</h2><p class="type">${m.type}</p>${rule()}
    <p><b>Classe d'armure</b> ${m.caT}</p><p><b>Points de vie</b> ${m.pv} (${m.pvF})</p><p><b>Vitesse</b> ${m.vit}</p>${rule()}
    <div class="abil">${['FOR','DEX','CON','INT','SAG','CHA'].map((n,i)=>`<div><small>${n}</small><b>${m.ab[i]}</b><i>${sg(mod(m.ab[i]))}</i></div>`).join('')}</div>${rule()}
    ${m.plus.map(x=>`<p>${x}</p>`).join('')}<p><b>Puissance</b> ${m.fp}</p>${rule()}
    ${m.traits.map(([n,d])=>`<p class="act"><b>${n}.</b> ${d}</p>`).join('')}
    <p class="kicker" style="margin:10px 0 4px">Actions</p>${m.actions.map(([n,d])=>`<p class="act"><b>${n}.</b> ${d}</p>`).join('')}</div>`;
}
function voirMon(id){ ouvrir(`<header><span></span><button onclick="closeSheet()">✕</button></header>${blocStat(MON[id])}`); }
function ouvrirPV(id){ ouvrirE(COMBAT.findIndex(c=>c.id===id), id); }
function ouvrirE(i, persoHorsCombat){
  saisie=''; cible = i>=0 ? i : persoHorsCombat;
  const e = i>=0 ? COMBAT[i] : { id:persoHorsCombat, pj:1, pv:PJ[persoHorsCombat].pv, max:PJ[persoHorsCombat].max, et:[] };
  ouvrir(`<header><h2>${nomE(e)}</h2><button onclick="closeSheet()">✕</button></header>
    <p class="small">PV actuels : <b style="color:var(--gold-hi)">${e.pv}</b> / ${e.max}</p>
    <div class="out" id="out">0</div>
    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(d=>`<button onclick="cle('${d}')">${d}</button>`).join('')}<button onclick="cle('C')">Effacer</button><button onclick="cle('0')">0</button><button onclick="cle('<')" aria-label="Effacer un chiffre">⌫</button></div>
    <div class="g3"><button class="or" onclick="appliquer(-1)">Dégâts</button><button onclick="appliquer(1)">Soin</button><button onclick="appliquer(0)">Moitié</button></div>
    ${i>=0?`<p class="kicker" style="margin-top:14px">États</p><div class="conds">${ETATS.map(c=>`<button class="${e.et.includes(c)?'on':''}" onclick="etat(${i},'${c}')">${c}</button>`).join('')}</div>`:''}
    ${e.mon?`<details style="margin-top:14px"><summary class="kicker" style="cursor:pointer">Fiche de la créature</summary><div style="margin-top:8px">${blocStat(MON[e.mon])}</div></details>`:''}`);
}
function cle(k){ saisie = k==='C'?'' : k==='<'?saisie.slice(0,-1) : (saisie+k).replace(/^0+(?=\d)/,'').slice(0,4); $('out').textContent=saisie||'0'; }
function appliquer(s){
  const n=Number(saisie)||0;
  const e = typeof cible==='number' ? COMBAT[cible] : null;
  const p = e&&e.pj ? PJ[e.id] : (typeof cible==='string' ? PJ[cible] : null);
  const obj = e || p;
  obj.pv = s===1 ? Math.min(obj.max,obj.pv+n) : Math.max(0,obj.pv-(s===0?Math.floor(n/2):n));
  if(e&&p) p.pv=e.pv;
  if(e&&e.mon&&e.pv===0&&!e.et.includes('À terre')) e.et.push('À terre');
  closeSheet(); draw();
}
function etat(i,c){ const e=COMBAT[i]; e.et = e.et.includes(c)?e.et.filter(x=>x!==c):[...e.et,c]; ouvrirE(i); draw(); }

draw();
</script>
