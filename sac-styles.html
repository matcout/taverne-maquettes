<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sac — 3 styles</title>
<style>
  :root {
    --bg: #0d0b09; --surface: #16120e; --surface-2: #1d1813; --line: #3a2f22;
    --ink: #ebe2d0; --muted: #a39580; --faint: #76695a;
    --gold: #d8b26a; --gold-hi: #f4d68f; --gold-lo: #8a6d3b;
    --life: #6fae6a; --warn: #d99a3a; --blood: #c0392b; --arcane: #a58bdc;
    /* Style A : neutre, comme l'autre app */
    --a-bg: #14121a; --a-card: #1c1a23; --a-line: #34313d; --a-ink: #f1eef6; --a-muted: #a29fae; --a-btn: #24212c;
    --serif: 'Cormorant Garamond', 'EB Garamond', Garamond, 'Palatino Linotype', Georgia, serif;
    --sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
    --touch: 44px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
  header.top { padding: 16px; max-width: 430px; margin: 0 auto; }
  header.top h1 { font: 600 24px/1.2 var(--serif); color: var(--gold-hi); margin: 0 0 4px; }
  header.top p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .switch { display: flex; gap: 8px; }
  .switch button { flex: 1; min-height: var(--touch); border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); color: var(--ink); font: 600 14px var(--sans); cursor: pointer; }
  .switch button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold-hi); background: #2a2116; }
  .note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  main { max-width: 430px; margin: 0 auto; padding: 0 16px 40px; }
  .view { display: none; } .view.on { display: block; }

  /* ---------- commun ---------- */
  .hero { position: relative; border-radius: 16px; overflow: hidden; margin: 12px 0 18px; padding: 70px 16px 16px;
    background: radial-gradient(120% 90% at 70% 10%, #3b4a63 0%, #1b1f2b 55%, #0d0b09 100%); }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 30%, #0008); }
  .hero > * { position: relative; z-index: 1; }
  .hero .back { position: absolute; top: 12px; left: 12px; padding: 8px 14px; border-radius: 999px; background: #0008; font-size: 14px; }
  .hero h2 { margin: 0; font: 700 30px/1.1 var(--serif); }
  .hero p { margin: 4px 0 0; font-size: 13px; color: #d6d2dc; }
  .hero p.small { color: #aaa5b5; }
  .qty { display: flex; align-items: center; gap: 6px; flex: none; }
  .qty button { width: var(--touch); height: var(--touch); border-radius: 10px; font-size: 18px; cursor: pointer; }
  .qty output { min-width: 48px; height: var(--touch); display: grid; place-items: center; border-radius: 10px; font-size: 18px; }
  .unit { font-size: 13px; }
  .row > div:first-child, .line > div:first-child { flex: 1; min-width: 0; }
  .chev { margin-left: auto; font-size: 18px; }

  /* ---------- A : fidèle à l'autre app ---------- */
  #A { background: var(--a-bg); color: var(--a-ink); border-radius: 18px; padding: 4px 12px 16px; }
  #A h3 { font: 700 26px/1.2 var(--serif); margin: 6px 0 12px; }
  #A h4 { font: 600 18px/1.2 var(--sans); margin: 18px 0 10px; }
  #A .card { background: var(--a-card); border: 1px solid var(--a-line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  #A .row { display: flex; align-items: center; gap: 12px; min-height: 64px; }
  #A .row b { display: block; font-weight: 600; }
  #A .row small { color: var(--a-muted); font-size: 14px; }
  #A .qty button { background: var(--a-btn); color: var(--a-ink); border: 1px solid var(--a-line); }
  #A .qty output { background: #0f0e13; color: var(--gold); border: 1px solid var(--a-line); }
  #A .bar { height: 10px; border-radius: 99px; background: #34313d; overflow: hidden; margin: 10px 0 8px; }
  #A .bar i { display: block; height: 100%; background: var(--life); border-radius: 99px; }
  #A .add { width: 100%; min-height: 52px; border-radius: 14px; border: 1px solid var(--a-line); background: var(--a-card); color: var(--a-ink); font-size: 16px; cursor: pointer; }
  #A .purse { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
  #A .purse div { background: #0f0e13; border: 1px solid var(--a-line); border-radius: 10px; padding: 8px 0; }
  #A .purse b { display: block; font-size: 18px; color: var(--gold); }
  #A .purse small { color: var(--a-muted); }

  /* ---------- B : Taverne dorée ---------- */
  #B h3 { font: 700 28px/1.1 var(--serif); color: var(--gold-hi); margin: 6px 0 12px; letter-spacing: .02em; }
  #B h4 { display: flex; align-items: center; gap: 10px; font: 600 12px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin: 20px 0 10px; }
  #B h4::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold-lo), transparent); }
  #B .card { background: linear-gradient(180deg, var(--surface-2), var(--surface)); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; box-shadow: inset 0 1px 0 #ffffff08; }
  #B .row { display: flex; align-items: center; gap: 12px; min-height: 60px; }
  #B .row b { display: block; font: 600 18px/1.2 var(--serif); }
  #B .row small { color: var(--muted); font-size: 13px; }
  #B .magic { border-color: var(--gold-lo); background: radial-gradient(120% 140% at 0 0, #3a2c14 0%, var(--surface) 60%); }
  #B .magic .tag { display: inline-block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--arcane); border: 1px solid #a58bdc66; border-radius: 99px; padding: 2px 8px; margin-top: 6px; }
  #B .qty button { background: #120f0b; color: var(--gold); border: 1px solid var(--gold-lo); }
  #B .qty output { background: #0a0807; color: var(--gold-hi); border: 1px solid var(--line); font-family: var(--serif); font-size: 20px; }
  #B .bar { height: 8px; border-radius: 99px; background: #2a2219; overflow: hidden; margin: 10px 0 8px; }
  #B .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--life), #9ccf6e); }
  #B .stats { display: flex; justify-content: space-between; align-items: baseline; }
  #B .stats b { font: 700 24px var(--serif); color: var(--gold-hi); }
  #B .add { width: 100%; min-height: 52px; border-radius: 12px; border: 1px dashed var(--gold-lo); background: transparent; color: var(--gold); font: 600 15px var(--sans); cursor: pointer; }
  #B .purse { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
  #B .purse div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 0; background: #0a0807; }
  #B .purse b { display: block; font: 700 20px var(--serif); }
  #B .purse .gp b { color: var(--gold-hi); } #B .purse .sp b { color: #cfd3d8; } #B .purse .cp b { color: #d08a5a; } #B .purse .pp b { color: #e6e6f0; }
  #B .purse small { color: var(--muted); font-size: 12px; }

  /* ---------- C : compact ---------- */
  #C h3 { font: 700 26px/1.1 var(--serif); color: var(--gold-hi); margin: 6px 0 10px; }
  #C .sum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  #C .sum > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  #C .sum small { display: block; color: var(--muted); font-size: 12px; }
  #C .sum b { font: 700 20px var(--serif); color: var(--gold-hi); }
  #C .bar { height: 6px; border-radius: 99px; background: #2a2219; overflow: hidden; margin-top: 6px; }
  #C .bar i { display: block; height: 100%; background: var(--life); }
  #C details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
  #C summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; cursor: pointer; font: 600 17px var(--serif); }
  #C summary::-webkit-details-marker { display: none; }
  #C summary .count { margin-left: auto; color: var(--muted); font: 13px var(--sans); }
  #C summary::after { content: "›"; color: var(--gold); font-size: 20px; transition: transform .2s; }
  #C details[open] summary::after { transform: rotate(90deg); }
  #C .line { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 4px 14px; border-top: 1px solid #3a2f2266; }
  #C .line b { font-weight: 600; } #C .line small { display: block; color: var(--muted); font-size: 12px; }
  #C .chip { margin-left: auto; display: flex; align-items: center; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  #C .chip button { width: var(--touch); height: 38px; background: #0a0807; color: var(--gold); border: 0; font-size: 18px; cursor: pointer; }
  #C .chip output { min-width: 44px; text-align: center; font-weight: 700; color: var(--gold-hi); }
  #C .wt { color: var(--faint); font-size: 12px; min-width: 44px; text-align: right; }
  #C .add { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--gold); font: 600 15px var(--sans); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
</style>
</head>
<body>
<header class="top">
  <h1>Le Sac de Korgan — 3 styles</h1>
  <p>Maquettes pour l'onglet Sac de la Taverne. Données de la fiche de combat de Korgan. Les − / + marchent.</p>
  <div class="switch" role="group" aria-label="Choisir un style">
    <button aria-pressed="true" data-v="A">A · Fidèle</button>
    <button aria-pressed="false" data-v="B">B · Taverne</button>
    <button aria-pressed="false" data-v="C">C · Compact</button>
  </div>
  <p class="note" id="desc"></p>
</header>
<main>
  <section class="view on" id="A"></section>
  <section class="view" id="B"></section>
  <section class="view" id="C"></section>
</main>
<script>
  // Données fictives tirées de la fiche publique de Korgan
  const STR = 18;
  const bag = {
    magic: { name: 'Bottes de Fracas Divin', summary: 'Rare · bond, chute et onde de choc', weight: 0 },
    weapons: [
      { name: 'Maul', summary: '2d6+4 contondant · deux mains', weight: 10, qty: 1 },
      { name: 'Cornes', summary: '1d6+4 perforant · arme naturelle', weight: 0, qty: 1, fixed: true },
      { name: 'Hachettes', summary: '1d6+4 tranchant · lancer 20/60 pi', weight: 2, qty: 2 },
      { name: 'Javelots', summary: '1d6+4 perforant · lancer 30/120 pi', weight: 2, qty: 4 },
    ],
    items: [
      { name: 'Sceau de Kazigaranthi', summary: 'Poing minotaure serré', qty: 1 },
      { name: 'Cape sombre du clan de-Orilg', summary: 'Tissée par Maelis', qty: 1 },
      { name: 'Sac à dos', summary: 'Pack explorateur', weight: 5, qty: 1 },
      { name: 'Sac de couchage', summary: 'Pack explorateur', weight: 7, qty: 1 },
      { name: 'Gamelle', summary: 'Pack explorateur', weight: 1, qty: 1 },
      { name: 'Briquet', summary: 'Pack explorateur', weight: 1, qty: 1 },
      { name: 'Gourde', summary: 'Pack explorateur', weight: 5, qty: 1 },
      { name: 'Bâton', summary: 'Pack explorateur', weight: 4, qty: 1 },
      { name: 'Piège à gibier', summary: 'Pack explorateur', weight: 25, qty: 1 },
      { name: 'Trophée d’animal', summary: 'Clan', qty: 1 },
      { name: 'Instrument (tambour / cor de guerre)', summary: 'Outlander', weight: 3, qty: 1 },
      { name: 'Vêtements de voyage', summary: 'Pack explorateur', weight: 4, qty: 1 },
      { name: 'Torches', weight: 1, qty: 10 },
      { name: 'Rations', weight: 2, qty: 10 },
      { name: 'Corde', weight: 0.2, qty: 50, unit: 'pi' },
    ],
    purse: { pp: 0, gp: 10, sp: 0, cp: 0 },
  };
  const desc = {
    A: 'A · Fidèle : la mise en page de ton autre app (cartes grises, jauge verte, − / +), presque telle quelle.',
    B: 'B · Taverne : la même structure, mais aux couleurs de la Taverne (or, serif, objet magique mis en valeur, bourse en couleurs).',
    C: 'C · Compact : un résumé (charge, bourse) puis des sections qui se replient. Moins de défilement au combat.',
  };
  const fmt = (n) => (Math.round(n * 10) / 10).toString().replace('.', ',');
  const all = () => [...bag.weapons, ...bag.items];
  function load() {
    let total = 0, unknown = 0;
    for (const it of all()) { if (it.weight == null) unknown++; else total += it.weight * it.qty; }
    return { total, unknown, max: STR * 15, push: STR * 30 };
  }
  const qtyCtl = (it, i, list) => it.fixed ? '' :
    `<div class="qty"><button aria-label="Moins" data-l="${list}" data-i="${i}" data-d="-1">−</button><output>${it.qty}</output>${it.unit ? `<span class="unit">${it.unit}</span>` : ''}<button aria-label="Plus" data-l="${list}" data-i="${i}" data-d="1">+</button></div>`;
  const chipCtl = (it, i, list) => it.fixed ? '<span class="chip" style="padding:0 12px;height:38px;align-items:center;color:var(--muted)">—</span>' :
    `<div class="chip"><button aria-label="Moins" data-l="${list}" data-i="${i}" data-d="-1">−</button><output>${it.qty}${it.unit ? ' ' + it.unit : ''}</output><button aria-label="Plus" data-l="${list}" data-i="${i}" data-d="1">+</button></div>`;
  const hero = `<div class="hero"><span class="back">← Mes personnages</span><h2>Korgan de-Orilg</h2><p>Minotaure · Barbare 3 · Voie du Zélote</p><p class="small">Dragonlance · MJ André</p></div>`;
  const purseCells = () => ['pp', 'gp', 'sp', 'cp'].map(k => `<div class="${k}"><b>${bag.purse[k]}</b><small>${k}</small></div>`).join('');

  function renderA() {
    const l = load(), pct = Math.min(100, l.total / l.max * 100);
    const row = (it, i, list) => `<div class="card row"><div><b>${it.name}</b>${it.summary ? `<small>${it.summary}</small>` : ''}</div>${list === 'weapons' && it.fixed ? '<span class="chev">›</span>' : qtyCtl(it, i, list)}</div>`;
    return `${hero}<h3>Sac</h3>
      <div class="card"><b style="font-size:17px">Charge</b><div style="font-weight:700;font-size:18px;margin-top:8px">${fmt(l.total)} / ${l.max} lb</div>
      <div class="bar"><i style="width:${pct}%"></i></div><div>${pct < 50 ? 'OK' : 'Chargé'}</div>
      <small style="color:var(--a-muted)">Pousser / traîner / soulever : jusqu’à ${l.push} lb<br>${l.unknown} objets sans poids connu, non comptés.</small></div>
      <h4>Objet magique</h4><div class="card row"><div><b>${bag.magic.name}</b><small>${bag.magic.summary}</small></div><span class="chev">›</span></div>
      <h4>Armes</h4>${bag.weapons.map((w, i) => row(w, i, 'weapons')).join('')}
      <h4>Objets</h4>${bag.items.map((w, i) => row(w, i, 'items')).join('')}
      <h4>Bourse</h4><div class="card purse">${purseCells()}</div>
      <button class="add">+ Ajouter un objet</button>`;
  }
  function renderB() {
    const l = load(), pct = Math.min(100, l.total / l.max * 100);
    const row = (it, i, list) => `<div class="card row"><div><b>${it.name}</b>${it.summary ? `<small>${it.summary}</small>` : ''}${it.weight ? `<small>${it.summary ? ' · ' : ''}${fmt(it.weight * it.qty)} lb</small>` : ''}</div>${it.fixed ? '<span class="chev" style="color:var(--gold)">›</span>' : qtyCtl(it, i, list)}</div>`;
    return `${hero}<h3>Sac</h3>
      <div class="card"><div class="stats"><span style="color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase">Charge</span><span><b>${fmt(l.total)}</b> <span style="color:var(--muted)">/ ${l.max} lb</span></span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <small style="color:var(--muted)">${pct < 50 ? 'Léger, aucune pénalité.' : 'Lourd.'} Soulever jusqu’à ${l.push} lb · ${l.unknown} objets sans poids.</small></div>
      <h4>Objet magique</h4><div class="card row magic"><div><b>${bag.magic.name}</b><small>${bag.magic.summary}</small><br><span class="tag">Harmonisé</span></div><span class="chev" style="color:var(--gold)">›</span></div>
      <h4>Armes</h4>${bag.weapons.map((w, i) => row(w, i, 'weapons')).join('')}
      <h4>Objets</h4>${bag.items.map((w, i) => row(w, i, 'items')).join('')}
      <h4>Bourse</h4><div class="purse">${purseCells()}</div>
      <div style="height:12px"></div><button class="add">+ Ajouter au sac</button>`;
  }
  function renderC() {
    const l = load(), pct = Math.min(100, l.total / l.max * 100);
    const line = (it, i, list) => `<div class="line"><div><b>${it.name}</b>${it.summary ? `<small>${it.summary}</small>` : ''}</div>${chipCtl(it, i, list)}<span class="wt">${it.weight ? fmt(it.weight * it.qty) + ' lb' : ''}</span></div>`;
    const sec = (title, list, open) => `<details ${open ? 'open' : ''}><summary>${title}<span class="count">${bag[list].length}</span></summary>${bag[list].map((w, i) => line(w, i, list)).join('')}</details>`;
    return `${hero}<h3>Sac</h3>
      <div class="sum"><div><small>Charge</small><b>${fmt(l.total)}</b> <small style="display:inline">/ ${l.max} lb</small><div class="bar"><i style="width:${pct}%"></i></div></div>
      <div><small>Bourse</small><b>${bag.purse.gp}</b> <small style="display:inline">gp</small><small>${bag.purse.pp} pp · ${bag.purse.sp} sp · ${bag.purse.cp} cp</small></div></div>
      <details open><summary>✦ ${bag.magic.name}<span class="count">rare</span></summary><div class="line"><div><small style="font-size:14px">${bag.magic.summary}</small></div></div></details>
      ${sec('Armes', 'weapons', true)}${sec('Objets', 'items', false)}
      <button class="add">+ Ajouter au sac</button>`;
  }
  const renders = { A: renderA, B: renderB, C: renderC };
  let current = 'A';
  function show() {
    for (const v of 'ABC') document.getElementById(v).classList.toggle('on', v === current);
    const openStates = [...document.querySelectorAll('#C details')].map(d => d.open);
    const el = document.getElementById(current); el.innerHTML = renders[current]();
    if (current === 'C' && openStates.length) document.querySelectorAll('#C details').forEach((d, i) => d.open = openStates[i]);
    document.getElementById('desc').textContent = desc[current];
  }
  document.querySelector('.switch').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    current = b.dataset.v;
    document.querySelectorAll('.switch button').forEach(x => x.setAttribute('aria-pressed', x === b));
    show();
  });
  document.querySelector('main').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-d]'); if (!b) return;
    const it = bag[b.dataset.l][+b.dataset.i];
    it.qty = Math.max(0, it.qty + (+b.dataset.d) * (it.unit ? 5 : 1));
    show();
  });
  show();
</script>
</body>
</html>
