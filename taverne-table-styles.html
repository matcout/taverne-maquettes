<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taverne — styles de la table de combat</title>
<style>
/* Trois autres styles pour la « table de combat » (idée de Mathieu). Mêmes données, trois looks. */
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;transition:background .3s}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.app{max-width:600px;margin:auto;min-height:100vh;padding-bottom:30px}
.choix{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:8px;background:#000c;backdrop-filter:blur(6px)}
.choix button{min-height:40px;border:1px solid #ffffff33;background:transparent;color:#ddd;border-radius:6px;font:600 12px system-ui,sans-serif}
.choix button.on{background:#fff;color:#111}
.page{padding:14px 16px}
.titre{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-bottom:12px}
.titre h1{margin:0;line-height:1}
.note{margin-top:14px;padding:10px 12px;font:13px/1.5 system-ui,sans-serif;border-radius:6px}

/* ====== 1. FACE-À-FACE : acier et braise ====== */
body.s1{background:radial-gradient(100% 60% at 50% 0%,#1c2630,#0b0f13 70%);color:#dfe7ee}
.s1 .titre h1{font:800 26px/1 "Bahnschrift","DIN Alternate","Arial Narrow",system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase}
.s1 .titre small{display:block;font:700 10px system-ui;letter-spacing:.24em;text-transform:uppercase;color:#7f93a5;margin-bottom:4px}
.s1 .badge{font:700 11px system-ui;padding:4px 9px;border-radius:999px;background:#5fd1c122;color:#7fe6d6;border:1px solid #5fd1c166}
.vs-tete{display:grid;grid-template-columns:1fr 40px 1fr;text-align:center;font:800 11px system-ui;letter-spacing:.2em;text-transform:uppercase;margin-bottom:6px}
.vs-tete .a{color:#5fd1c1}.vs-tete .e{color:#ff8a3d}
.vs{position:relative;display:grid;gap:8px}
.vs::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:linear-gradient(#5fd1c1,#ff8a3d)}
.vs-row{position:relative;display:grid;grid-template-columns:1fr 40px 1fr;align-items:center}
.vs-row.cur::before{content:"";position:absolute;inset:-4px -8px;border-radius:10px;background:linear-gradient(90deg,#5fd1c11f,#ffffff10,#ff8a3d1f);border:1px solid #ffffff2a}
.vs-node{position:relative;z-index:1;justify-self:center;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 13px system-ui;background:#0b0f13;border:2px solid #44535f;color:#b7c4cf}
.vs-row.cur .vs-node{background:#fff;color:#0b0f13;border-color:#fff;box-shadow:0 0 14px #fff8}
.vs-card{position:relative;z-index:1;display:flex;gap:8px;align-items:center;padding:7px;border-radius:8px;background:#131b22;border:1px solid #263440;text-align:left;min-height:0;width:100%}
.vs-card.al{grid-column:1;border-left:3px solid #5fd1c1}
.vs-card.en{grid-column:3;border-right:3px solid #ff8a3d;background:#1c1512;border-color:#3a2a22;flex-direction:row-reverse;text-align:right}
.vs-card img,.vs-card .mono{width:40px;height:40px;border-radius:8px;object-fit:cover;object-position:center 18%;flex:0 0 auto}
.vs-card .mono{display:grid;place-items:center;background:#3a1d12;color:#ffb07a;font:800 14px system-ui}
.vs-card b{display:block;font:700 13px/1.15 system-ui}
.vs-card .hp{height:4px;border-radius:2px;background:#22303b;margin:4px 0 2px;overflow:hidden}
.vs-card .hp i{display:block;height:100%;background:#5fd1c1}
.vs-card small{font:600 10px system-ui;color:#8fa2b2}
.vs-card .fx{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.en .fx{justify-content:flex-end}
.vs-card .fx span{font:700 9px system-ui;padding:1px 5px;border-radius:999px}
.fx .b1{background:#5fd1c122;color:#8ff0e2}.fx .m1{background:#ff8a3d26;color:#ffb07a}
.vs-card.down{opacity:.35;filter:grayscale(1)}
.vs-card.moi{box-shadow:0 0 0 1px #5fd1c1}
.s1 .note{background:#5fd1c112;border-left:3px solid #5fd1c1;color:#cfe2ea}

/* ====== 2. CARTES À COLLECTIONNER : nuit étoilée ====== */
body.s2{background:radial-gradient(2px 2px at 20% 30%,#fff6,transparent),radial-gradient(1.5px 1.5px at 70% 15%,#fff5,transparent),radial-gradient(1.5px 1.5px at 85% 60%,#fff4,transparent),radial-gradient(120% 70% at 50% 20%,#2c2254,#120d24 70%);color:#f1ecff}
.s2 .titre h1{font:900 28px/1 Georgia,serif;font-style:italic;background:linear-gradient(90deg,#ffd27a,#ff8fd0,#8fc8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.s2 .titre small{display:block;font:700 10px system-ui;letter-spacing:.2em;text-transform:uppercase;color:#a99ee0;margin-bottom:4px}
.s2 .badge{font:800 11px system-ui;padding:4px 10px;border-radius:999px;background:linear-gradient(90deg,#ffd27a,#ff9d6b);color:#2a1440}
.s2 .app{overflow-x:hidden}
.main2{display:flex;justify-content:center;padding:14px 0 10px}
.main2:not(.trois) .tcg{width:88px;margin:0 -2px}
.main2.trois{padding-top:24px}
.main2:not(.trois) .tcg .mono{font-size:24px}
.tcg{position:relative;flex:0 0 auto;width:112px;aspect-ratio:3/4.3;margin:0 -4px;border-radius:12px;padding:5px;text-align:left;border:0;transition:transform .25s;box-shadow:0 8px 20px #0009}
.tcg.al{background:linear-gradient(160deg,#9fd3ff,#3a6fd8 45%,#1d2f7a)}
.tcg.en{background:linear-gradient(160deg,#ffb38a,#d23b4a 45%,#5a1030)}
.main2 .tcg:nth-child(1){transform:rotate(-7deg) translateY(8px)}
.main2 .tcg:nth-child(2){transform:rotate(-2.5deg)}
.main2 .tcg:nth-child(3){transform:rotate(2.5deg)}
.main2 .tcg:nth-child(4){transform:rotate(7deg) translateY(8px)}
.main2.trois .tcg:nth-child(1){transform:rotate(-5deg) translateY(6px)}
.main2.trois .tcg:nth-child(2){transform:none}
.main2.trois .tcg:nth-child(3){transform:rotate(5deg) translateY(6px)}
.main2 .tcg.cur{transform:translateY(-14px) scale(1.07)!important;z-index:5;box-shadow:0 0 0 2px #ffe9a8,0 0 26px #ffd27acc}
.tcg .in{height:100%;border-radius:8px;overflow:hidden;background:#140f26;display:flex;flex-direction:column}
.tcg .art{flex:1 1 55%;min-height:0;position:relative;overflow:hidden}
.tcg .art img{width:100%;height:100%;object-fit:cover;object-position:center 18%}
.tcg .art .mono{width:100%;height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#7a2040,#2a0c1c);font:900 30px Georgia,serif;color:#ffc2c9;text-shadow:0 0 12px #ff5a7a}
.tcg .nom{background:linear-gradient(90deg,#ffe9a8,#e0b95e);color:#2a1440;font:800 11px/1.1 Georgia,serif;padding:4px 6px;text-align:center}
.tcg.en .nom{background:linear-gradient(90deg,#ffd0c4,#e48a7c)}
.tcg .txt{padding:4px 6px 20px 14px;font:600 9.5px/1.25 system-ui;color:#d9d0ff;min-height:38px}
.tcg .gem{position:absolute;top:-6px;left:-6px;width:28px;height:28px;transform:rotate(45deg);border-radius:6px;background:linear-gradient(135deg,#fff3c4,#e2a93b);box-shadow:0 2px 6px #0008;display:grid;place-items:center;z-index:2}
.tcg .gem b{transform:rotate(-45deg);font:900 13px Georgia,serif;color:#3a2200}
.tcg .coeur{position:absolute;right:-6px;bottom:-6px;min-width:36px;height:30px;padding:0 6px;border-radius:15px;background:linear-gradient(135deg,#8ff0a0,#2b9a4a);color:#06260f;font:900 12px/30px Georgia,serif;text-align:center;box-shadow:0 2px 6px #0008;z-index:2}
.tcg.en .coeur{min-width:30px;background:linear-gradient(135deg,#ffd27a,#c97a1d);color:#2a1400}
.tcg .etat2{display:block;font-weight:800;color:#ffd27a}
.tcg .jetons{position:absolute;left:-4px;bottom:22px;display:flex;flex-direction:column;gap:3px;z-index:2}
.tcg .jetons i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:900 10px/1 system-ui;font-style:normal;box-shadow:0 2px 4px #0009;border:2px solid #fff8}
.jetons .jb{background:#ffd27a;color:#3a2200}.jetons .jm{background:#d23b4a;color:#fff}
.tcg.down{filter:grayscale(1) brightness(.6)}
.s2 .sep{text-align:center;font:800 10px system-ui;letter-spacing:.3em;text-transform:uppercase;color:#a99ee0;margin:26px 0 0}
.s2 .leg{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font:600 11px system-ui;color:#cfc6ff;margin-top:14px}
.s2 .note{background:#ffffff12;border:1px solid #ffffff22;color:#e6e0ff}

/* ====== 3. PARCHEMIN : registre de campagne ====== */
body.s3{background:#d9c7a1;color:#2b2116}
.s3 .app{background:radial-gradient(130% 90% at 50% 0%,#f4e8cc,#e6d3aa 60%,#d4bc8c);box-shadow:inset 0 0 60px #8a6a3a55}
.s3 .titre h1{font:700 30px/1 "Palatino Linotype",Palatino,Georgia,serif;font-variant:small-caps;letter-spacing:.04em}
.s3 .titre small{display:block;font:italic 14px Georgia,serif;color:#6b5434;margin-bottom:2px}
.s3 .badge{font:italic 13px Georgia,serif;color:#8b1e14;border-bottom:1px solid #8b1e14}
.reg{border-top:2px solid #2b2116;border-bottom:2px solid #2b2116;margin-top:6px}
.reg-l{position:relative;display:grid;grid-template-columns:30px 48px 1fr;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px dashed #6b543466;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0;min-height:0}
.reg-l:last-child{border-bottom:0}
.reg-l .num{font:700 20px Georgia,serif;font-variant:small-caps;color:#6b5434;text-align:center}
.reg-l img,.reg-l .mono{width:48px;height:58px;border-radius:50%/45%;object-fit:cover;object-position:center 18%;filter:sepia(.75) contrast(1.05);border:2px solid #2b2116;box-shadow:0 0 0 3px #e9dab8,0 0 0 4px #6b5434}
.reg-l .mono{display:grid;place-items:center;background:#e9dab8;font:700 18px Georgia,serif;font-variant:small-caps;color:#8b1e14;filter:none}
.reg-l h3{margin:0;font:700 19px/1.1 "Palatino Linotype",Palatino,Georgia,serif;font-variant:small-caps}
.reg-l.en h3{color:#8b1e14}
.reg-l .etat{font:italic 13.5px Georgia,serif;color:#4a3a26}
.encre{display:flex;gap:3px;margin-top:3px}
.encre i{width:9px;height:9px;border-radius:50%;background:#2b2116}
.encre i.vide{background:none;border:1px solid #2b211688}
.sceaux{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.sceau{display:inline-flex;align-items:center;gap:5px;font:italic 12.5px Georgia,serif}
.sceau i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:700 10px Georgia,serif;font-style:normal;color:#f4e8cc;box-shadow:inset 0 0 0 2px #0002,0 1px 2px #0005}
.sceau.b i{background:radial-gradient(circle at 35% 35%,#d1a640,#8a6a1c)}.sceau.m i{background:radial-gradient(circle at 35% 35%,#c0392b,#6e140c)}
.reg-l.cur{background:linear-gradient(90deg,#f6d77a66,transparent 85%)}
.reg-l.cur::before{content:"➳";position:absolute;left:-14px;top:50%;transform:translateY(-50%);font-size:20px;color:#8b1e14}
.reg-l.down{opacity:.5}.reg-l.down h3{text-decoration:line-through}
.s3 .note{background:#fff4;border:1px solid #6b543466;color:#3b2f20;font-family:Georgia,serif}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function s1(){
  return `<div class="titre"><div><small>L'Auberge de l'Ours Rouge</small><h1>Round 3</h1></div><span class="badge">Tour de Kael'thar</span></div>
  <div class="vs-tete"><span class="a">Alliés</span><span></span><span class="e">Ennemis</span></div>

    <div class="in"><div class="art">${e.img?`<img src="${e.img}" alt="">`:`<div class="mono">${e.mono}</div>`}</div>
      <div class="nom">${e.nom}</div>
      <div class="txt">${e.al?'':`<span class="etat2">${vague(e.pv,e.max)}</span>`}${[...e.bu.map(x=>'✦ '+x),...e.ma.map(x=>'▼ '+x)].join('<br>')||(e.al?'<span style="opacity:.6">Aucun effet</span>':'')}</div></div>
    <span class="jetons">${e.bu.map(()=>'<i class="jb">✦</i>').join('')}${e.ma.map(()=>'<i class="jm">▼</i>').join('')}</span>
    <span class="coeur">${e.al?e.pv:'?'}</span></button>`;
}
function s2(){
  return `<div class="titre"><div><small>L'Auberge de l'Ours Rouge</small><h1>Round 3</h1></div><span class="badge">Tour de Kael'thar</span></div>
  <p class="sep" style="margin-top:4px">Ennemis</p>
  <div class="main2">${C.filter(e=>!e.al).map(tcg).join('')}</div>
  <p class="sep">Ta main · alliés</p>
  <div class="main2 trois">${C.filter(e=>e.al).map(tcg).join('')}</div>
  <div class="leg"><span>◆ ordre de jeu</span><span>● PV (? = secret)</span><span style="color:#ffd27a">✦ bonus</span><span style="color:#ff8f9d">▼ malus</span></div>
  <div class="note"><b>Cartes à collectionner :</b> chaque personnage est une vraie carte, en éventail comme une main. La gemme = l'ordre de jeu, les jetons posés sur la carte = les effets. La carte qui joue sort de la main.</div>`;
}
function s3(){
  return `<div class="titre"><div><small>L'Auberge de l'Ours Rouge</small><h1>Troisième round</h1></div><span class="badge">Kael'thar a la main</span></div>
  <div class="reg">${C.map((e,i)=>`<button class="reg-l ${e.al?'al':'en'} ${i===COUR?'cur':''} ${e.pv<=0?'down':''}">
    <span class="num">${ROM[i]}</span>
    ${e.img?`<img src="${e.img}" alt="">`:`<span class="mono">${e.mono}</span>`}
    <div><h3>${e.nom}</h3>
      ${e.al?`<div class="encre">${Array.from({length:10},(_,k)=>`<i class="${k<Math.round(e.pv/e.max*10)?'':'vide'}"></i>`).join('')}</div><span class="etat">${e.pv} sur ${e.max} points de vie</span>`:`<span class="etat">« ${vague(e.pv,e.max)} »</span>`}
      <div class="sceaux">${e.bu.map(x=>`<span class="sceau b"><i>✦</i>${x}</span>`).join('')}${e.ma.map(x=>`<span class="sceau m"><i>▼</i>${x}</span>`).join('')}</div></div>
  </button>`).join('')}</div>
  <div class="note"><b>Parchemin :</b> le registre d'initiative tenu à la plume. Chiffres romains pour l'ordre, sceaux de cire pour les effets (or = bonus, rouge = malus). Plus calme, très lisible.</div>`;
}
function draw(){
  document.body.className='s'+STYLE;
  document.getElementById('app').innerHTML = `<div class="choix">${['Face-à-face','Cartes','Parchemin'].map((n,i)=>`<button class="${STYLE===i+1?'on':''}" onclick="STYLE=${i+1};draw();scrollTo(0,0)">${n}</button>`).join('')}</div>
    <div class="page">${[s1,s2,s3][STYLE-1]()}</div>`;
}
draw();
</script>
</body>
</html>
